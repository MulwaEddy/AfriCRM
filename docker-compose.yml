version: "3.8"

services:
  africrm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: africrm_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://africrm_user:africrm_pass@postgres:5432/africrm_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=africrm_super_secret_jwt_key_nairobi_2026
      - DEFAULT_CURRENCY=KES
      - TIMEZONE=Africa/Nairobi
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - africrm-network

  postgres:
    image: postgres:16-alpine
    container_name: africrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: africrm_user
      POSTGRES_PASSWORD: africrm_pass
      POSTGRES_DB: africrm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africrm_user -d africrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - africrm-network

  redis:
    image: redis:7-alpine
    container_name: africrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - africrm-network

networks:
  africrm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
